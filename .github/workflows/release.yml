name: Build and Deploy Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Compile Main and Renderer Bundles
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          MAIN_VITE_RAZORPAY_KEY_ID: ${{ secrets.MAIN_VITE_RAZORPAY_KEY_ID }}
          MAIN_VITE_RAZORPAY_KEY_SECRET: ${{ secrets.MAIN_VITE_RAZORPAY_KEY_SECRET }}
        run: npm run build

      - name: Build Executable and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always